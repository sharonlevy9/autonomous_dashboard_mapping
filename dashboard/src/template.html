<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פריסת רכיבים</title>
<style>
:root{
  color-scheme:light;
  --bg:#e7e8ea; --card:#f4f4f5; --card2:#ffffff; --line:#d6d8dc; --text:#15181e; --muted:#7b8290;
  --accent:#16263f; --accent2:#2f5d8c; --warn:#c2571a; --bad:#c0352b; --ok:#2e6b4a;
  --r:22px; --shadow:0 1px 2px rgba(20,25,35,.05),0 8px 24px rgba(20,25,35,.06);
  /* Material 3 tokens (Google Material Web components read these) */
  --md-sys-color-primary:#16263f; --md-sys-color-on-primary:#fff;
  --md-sys-color-primary-container:#dbe4f1; --md-sys-color-on-primary-container:#16263f; --md-sys-color-surface-container-highest:#e4e6ea;
  --md-sys-color-secondary-container:#dbe4f1; --md-sys-color-on-secondary-container:#16263f;
  --md-sys-color-surface:#f4f4f5; --md-sys-color-surface-container:#f4f4f5; --md-sys-color-on-surface:#15181e;
  --md-sys-color-on-surface-variant:#5b6270; --md-sys-color-outline:#8b919c; --md-sys-color-outline-variant:#d6d8dc;
  --md-sys-color-surface-container-highest:#e4e6ea; --md-sys-color-surface-container-low:#f4f4f5;
  --md-sys-typescale-label-large-font:"Heebo","Roboto",system-ui,sans-serif;
  --md-ref-typeface-brand:"Heebo","Roboto",system-ui,sans-serif; --md-ref-typeface-plain:"Heebo","Roboto",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI","Heebo",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.app{display:grid;grid-template-rows:64px minmax(0,1fr) 112px;height:100%;gap:12px;padding:0 16px 14px}
header{display:flex;align-items:center;gap:16px}
.brand{font-size:17px;font-weight:600;white-space:nowrap}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{padding:7px 18px;border-radius:999px;color:var(--muted);min-width:64px}
.seg button.on{background:var(--accent);color:#fff}
.seg.small button{padding:5px 11px;min-width:34px;font-size:13px}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px}
.ibtn:hover{background:#fff}
.ibtn[disabled]{opacity:.35;cursor:default}
.ibtn.dark{background:var(--accent);color:#fff}
.hgrp{display:flex;gap:8px}
main{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:12px;min-height:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);min-height:0;position:relative}
.cardh{font-size:12px;color:var(--muted);padding:14px 18px 6px}
/* component list */
.list{display:flex;flex-direction:column;overflow:hidden}
.list .rows{overflow:auto;padding:0 8px 10px;flex:1}
.row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;width:100%;text-align:start}
.row:hover{background:#fff}
.row.sel{background:var(--accent);color:#fff}
.row .dot{width:10px;height:10px;border-radius:3px;flex:none}
.row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c{font-size:12px;color:var(--muted)}
.row.sel .c{color:#c7d3e6}
.row .w{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}
/* editor */
.editor{display:flex;flex-direction:column;overflow:hidden}
.stats{display:flex;gap:6px;padding:14px 22px 0;align-items:flex-end}
.stat{padding-inline-end:26px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:300;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:13px;color:var(--muted);font-weight:400;margin-inline-start:3px}
.stat .s{font-size:11px;color:var(--warn)}
.stat.bad .v{color:var(--bad)}.stat.ok .v{color:var(--ok)}
button.stat{text-align:start}
.stage{position:relative;flex:1;min-height:0;margin:6px 10px 10px;border-radius:16px;background:var(--card2);overflow:hidden}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
.zoom{position:absolute;bottom:12px;inset-inline-end:12px;display:flex;flex-direction:column;gap:6px}
.zoom .ibtn{width:34px;height:34px;font-size:16px}
.pop{flex:none;margin:0 10px 10px;min-height:92px;background:var(--card2);border-radius:16px;padding:12px 16px;padding-inline-end:38px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative}
.pop .a{min-width:220px;flex:1}.pop .b{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pop h3{margin:0;font-size:16px;font-weight:600}
.pop .m{color:var(--muted);font-size:12px}
.pop .why{font-size:12px;color:var(--muted);margin:4px 0 0}
.pop .why.tech{color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:0}
.pill{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px}
.pill:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.fields{display:grid;grid-template-columns:auto 84px auto 84px;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.fields input{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:end;direction:ltr;width:100%}
.fields input.unk{border-style:dashed}
.xbtn{position:absolute;top:6px;inset-inline-end:10px;font-size:18px;color:var(--muted)}
/* right column */
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.m3{height:290px;flex:none;overflow:hidden;display:flex;flex-direction:column}
.m3 #w3{flex:1;min-height:0;height:auto}.m3.nocv{height:auto}
/* step 4: view modes (single 2D view / 3D / all together), ranges, cables */
.vopts{display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;padding:8px 22px 0;font-size:12px;color:var(--muted)}
.vopts .grp{display:inline-flex;gap:6px;align-items:center}
.vopts .seg{box-shadow:none}
.vopts input[type=range]{width:96px}
.vopts b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.vopts .lg{flex-basis:100%;font-size:11px}
.wins{position:absolute;top:0;bottom:0;right:0;left:0;display:none;direction:ltr;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"t ." "s f";gap:6px;padding:6px;background:var(--card)}
.wcell{position:relative;background:var(--card2);border-radius:12px;overflow:hidden;min-width:0;min-height:0}
.wcell svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.wlab{position:absolute;top:6px;right:10px;font-size:11px;color:var(--muted);pointer-events:none;z-index:1}
.pane3{position:absolute;top:0;bottom:0;left:0;right:0;display:none;background:var(--card2)}
.split{position:absolute;top:0;bottom:0;width:12px;cursor:col-resize;display:none;z-index:3;touch-action:none;background:var(--card)}
.split::after{content:"";position:absolute;top:50%;left:4px;width:4px;height:48px;margin-top:-24px;border-radius:2px;background:#aab0ba}
#w3{position:relative;width:100%;height:100%}
#w3 canvas{width:100%;height:100%;display:block;touch-action:none}
.hint3{position:absolute;bottom:8px;left:10px;right:10px;font-size:11px;color:var(--muted);pointer-events:none;text-align:center;display:none}
.stage.v3d .hint3,.stage.vwin .hint3{display:block}
.stage.v3d #svg,.stage.vwin #svg{display:none}
.stage.v3d .pane3{display:block}
.stage.vwin .pane3{display:block;right:auto;width:var(--w3)}
.stage.vwin .split{display:block;left:var(--w3)}
.stage.vwin .wins{display:grid;left:calc(var(--w3) + 12px)}
.stage.v3d .zoom{display:none}
.stage.vwin .zoom{inset-inline-end:auto;inset-inline-start:12px;top:12px;bottom:auto}
.m3 .st{padding:8px 12px 12px;display:flex;justify-content:center}
.ctrl{flex:1;min-height:0;overflow:auto;padding-bottom:12px}
.ctl{display:grid;grid-template-columns:74px 1fr 66px;align-items:center;gap:10px;padding:5px 18px;font-size:13px}
.ctl .l{color:var(--muted)}
.ctl .val{white-space:nowrap;text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctl.wide{grid-template-columns:74px 1fr}
.step{display:flex;align-items:center;gap:10px}
.step .ibtn{width:30px;height:30px;font-size:15px}
.step b{min-width:18px;text-align:center}
.note{font-size:11px;color:var(--muted);padding:2px 18px 6px}
.ctl .val .num{width:52px;font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--text);text-align:center}
.ctl:has(.num){grid-template-columns:74px 1fr 84px}
.hgt{display:flex;gap:10px;align-items:center;padding:4px 18px 8px;font-size:12px}.hgt svg{width:54px;height:56px;flex:none}.hgt .m{font-size:11px;color:var(--muted)}
.reset{margin:6px 18px 0}
/* bottom strip */
.strip{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 6px;align-items:stretch}
.cfg{flex:none;width:190px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:8px 10px;display:flex;flex-direction:column;position:relative;text-align:start;border:2px solid transparent}
.cfg.on{background:#fff;border-color:var(--accent)}
.cfg svg{flex:1;min-height:0;width:100%}
.cfg .t{font-size:12px;display:flex;justify-content:space-between;color:var(--muted)}
.cfg.on .t{color:var(--text);font-weight:600}
.cfg .act{position:absolute;top:6px;inset-inline-start:6px;display:none;gap:4px}
.cfg:hover .act,.cfg.on .act{display:flex}
.act span{width:22px;height:22px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;border:1px solid var(--line)}
.act span:hover{background:var(--accent);color:#fff}
.cfg.add{align-items:center;justify-content:center;color:var(--muted);font-size:22px;width:120px;background:transparent;border:2px dashed var(--line);box-shadow:none}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.on{display:flex}
.mcard{background:var(--card2);border-radius:20px;padding:22px;max-width:860px;width:100%;max-height:88vh;overflow:auto}
.mcard h2{margin:0 0 12px;font-size:18px;font-weight:600}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:12px;color:var(--muted);font-weight:500}
.wl{list-style:none;margin:0;padding:0}.wl li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:center}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.rl{padding:10px 2px;border-bottom:1px solid var(--line)}.rl .rh{display:flex;gap:8px;align-items:center;font-size:15px}.rl .m{color:var(--muted);font-size:12px;margin:3px 0 6px}.rl .pf{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}.rl input[type=number],.rl select{padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:76px;direction:ltr;text-align:end}.rl select{width:auto;direction:rtl}.rl .live{font-size:12px;color:var(--text);margin-top:4px}
.it{cursor:grab}.it:active{cursor:grabbing}
.it.auto{cursor:default}
@media (max-width:1100px){
  body{overflow:auto}.app{height:auto;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr}.editor{height:70vh}.list{max-height:240px}.side{order:-1}
}
/* legs tab */
.ctl.col{grid-template-columns:1fr;gap:4px}.ctl.col .seg{justify-self:start}
.legtab{display:none;position:fixed;inset:72px 16px 16px;z-index:9;background:var(--bg);border-radius:var(--r);padding:12px;box-shadow:0 16px 60px rgba(15,20,30,.35);grid-template-columns:330px minmax(0,1fr);gap:12px;min-height:0}
.legscrim{display:none;position:fixed;inset:0;background:rgba(15,20,30,.4);z-index:8}
.app.tl .legscrim{display:block}
.lclose{position:absolute;top:8px;inset-inline-end:10px;z-index:2}
.app.tl .legtab{display:grid}
.lctl{overflow:auto;padding-bottom:14px}
.lctl select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);min-width:0}
.lmain{display:grid;grid-template-rows:minmax(0,1.4fr) minmax(0,1fr);gap:12px;min-height:0}
.l3{display:flex;flex-direction:column;overflow:hidden}.l3 canvas{flex:1;min-height:0;width:100%;display:block}
.lst{display:flex;gap:10px;align-items:center;padding:8px 18px 12px;font-size:12px;color:var(--muted)}.lst input{flex:1}
.lsv{overflow:hidden}.lsv svg{width:100%;height:100%;display:block}
.lnum{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:6px 18px 8px;font-size:13px}.lnum span{color:var(--muted)}.lnum b{font-weight:600;font-variant-numeric:tabular-nums;text-align:end}.lnum b.bad{color:var(--bad)}
.lw{padding:2px 18px 4px;font-size:12px;color:var(--bad)}.lw.ok{color:var(--ok)}
@media (max-width:1100px){.legtab{grid-template-columns:1fr;overflow:auto}.lmain{grid-template-rows:60vh 320px}}
/* stage 2: Material shell */
header md-tabs{--md-primary-tab-container-color:transparent;min-width:200px;border-radius:999px}
header md-icon-button svg{width:24px;height:24px;fill:currentColor}
header md-icon-button{--md-icon-button-icon-color:var(--text)}
header md-icon-button[disabled]{opacity:.35}
.modesw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.modesw md-switch{--md-switch-selected-track-color:var(--accent)}
.pres-badge{display:none;font-size:12px;color:var(--muted)}
/* presentation mode: read-only, only looking. Nothing can be dragged or edited. */
.app.pres{grid-template-rows:64px minmax(0,1fr)}
.app.pres .strip,.app.pres #ctrl,.app.pres .edit,.app.pres .pop .fields,.app.pres .pop .btns,.app.pres .xbtn,.app.pres .act{display:none}
.app.pres main{grid-template-columns:210px minmax(0,1fr) 330px}
.app.pres .it{cursor:default}
.app.pres .side .m3{height:auto;flex:1}
@media (max-width:1100px){.app.pres{grid-template-rows:auto auto}}

/* stage 4: component card drawer */
.row .thumb{flex:none}.row .info{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--muted);background:var(--card2);font-style:italic;font-family:Georgia,serif}
.row .info:hover{background:var(--accent);color:#fff}.row.sel .info{background:transparent;color:#fff;border-color:#c7d3e6}
.rsep{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.cdrawer{position:fixed;top:64px;bottom:10px;left:10px;width:min(440px,92vw);background:var(--card2);border-radius:20px;box-shadow:0 8px 30px rgba(20,28,40,.25);z-index:8;display:none;flex-direction:column;overflow:hidden}
.cdrawer.on{display:flex}
.chd{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none}.chd .cht{flex:1;font-size:13px;color:var(--muted)}
.cb2{overflow:auto;padding:12px 16px 20px;flex:1}
.ctitle{display:flex;gap:12px;align-items:center}.ctitle h3{margin:0;font-size:19px;font-weight:600}.ctitle .m{font-size:12px;color:var(--muted);margin-top:2px}
.cshort{margin:12px 0 4px;font-size:15px;line-height:1.55}
.cs{border-top:1px solid var(--line);padding:2px 0}.cs>summary{cursor:pointer;padding:9px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
.cs>summary::after{content:'▾';color:var(--muted)}.cs[open]>summary::after{content:'▴'}
.cs .cb{padding:0 0 10px;font-size:14px;line-height:1.55}.cs ul{margin:0;padding-inline-start:20px}.cs li{margin:4px 0}.cs p{margin:6px 0}
.cmeta{font-size:12px;color:var(--muted)}
.term{border-bottom:1px dotted var(--muted);cursor:help}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}.chip.est{background:#f3e3bf;color:#6b4b00}.chip.unk{background:#f0d6d2;color:#7a2a1f}.chip.src{background:var(--accent-soft,#dbe4f1);color:var(--accent)}
.nums td{padding:6px 6px;font-size:13px}.pill.sm{font-size:11px;padding:2px 8px;margin-inline-start:6px}
dl.gl{margin:0}dl.gl dt{font-weight:600;margin-top:10px}dl.gl dt.hit{background:#fff3c4;padding:2px 6px;border-radius:6px}dl.gl dd{margin:2px 0 0;color:#333;line-height:1.5}
.trow{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}.tv{display:flex;flex-direction:column;align-items:center;gap:6px}.tr{background:#cfd6e2;border:1px solid #16263f;box-sizing:border-box}.tr.ref{background:#e4e6ea;border-color:#8b919c}.tl{font-size:12px;color:var(--muted);text-align:center;max-width:200px}
@media(max-width:900px){.cdrawer{top:auto;height:70vh;left:6px;right:6px;width:auto}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">פריסת רכיבים</div>
    <md-filled-tonal-button id="legsbtn">רגליים</md-filled-tonal-button>
    <div class="spacer"></div>
    <div class="seg" id="viewseg"><button data-m="side" class="on">מהצד</button><button data-m="top">מלמעלה</button><button data-m="front">מלפנים</button><button data-m="3d">תלת מימד</button><button data-m="win" title="שלושה היטלים ותלת מימד, יחד">הכול יחד</button></div>
    <div class="spacer"></div>
    <div class="hgrp">
      <label class="modesw"><md-switch id="modesw" aria-label="מצב הצגה"></md-switch><span id="modelab">מצב תכנון</span></label>
      <md-filled-tonal-button id="rulesbtn" class="edit">כללי הנדסה</md-filled-tonal-button>
      <md-icon-button id="undo" class="edit" title="ביטול" aria-label="ביטול"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg></md-icon-button>
      <md-icon-button id="redo" class="edit" title="שחזור" aria-label="שחזור"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg></md-icon-button>
      <md-icon-button id="compare" title="השוואה בין קונפיגורציות" aria-label="השוואה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.01 14H2v2h7.01v3L13 15l-3.99-4v3zm5.98-1v-3H22V8h-7.01V5L11 9l3.99 4z"/></svg></md-icon-button>
      <md-icon-button id="export" title="שמירת נתונים לקובץ" aria-label="שמירה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></md-icon-button>
      <md-icon-button id="import" class="edit" title="טעינת נתונים מקובץ" aria-label="טעינה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg></md-icon-button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </header>
  <main>
    <section class="card list"><div class="cardh">רכיבים</div><div class="rows" id="rows"></div></section>
    <section class="card editor">
      <div class="stats" id="stats"></div>
      <div class="vopts" id="vopts"></div>
      <div class="stage" id="stage">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>

function chip(k,key){const v=k[key];if(v==null)return'<span class="chip unk">לא ידוע</span>';return(k.estimate||[]).includes(key)?'<span class="chip est">הערכה</span>':'<span class="chip src">יש מקור</span>'}
function dimTxt(k){const d=k.dims,f=v=>Math.round(v*10)/10;return k.shape==='cyl'?'קוטר '+f(d[0])+' × גובה '+f(d[1])+' מ"מ':f(d[0])+' × '+f(d[1])+' × '+f(d[2])+' מ"מ (אורך × גובה × רוחב)'}
function renderCard(){
  const dr=$('#cdrawer');dr.classList.toggle('on',CD.open);document.body.classList.toggle('cdon',CD.open);if(!CD.open){dr.innerHTML='';return}
  const c=cfg();if(sel&&sel!=='vent'){const it=c.items.find(i=>i.id===sel);if(it){CD.cid=it.cid;CD.extra=null}}else if(sel==='vent'){CD.cid='o2';CD.extra=null}
  const cid=CD.cid,k=cid&&cat[cid],cardId=CD.extra||cardOf(cid),cd=CARDS[cardId];GSEEN=new Set();
  const top='<div class="chd"><md-icon-button id="cdx" aria-label="סגירת הכרטיס" title="סגירה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></md-icon-button><span class="cht">כרטיס רכיב</span><button class="pill" id="cdgl">מונחון</button></div>';
  if(!cd){dr.innerHTML=top+'<div class="cb2"><div class="m">בחרי רכיב ברשימה או במודל כדי לראות את הכרטיס שלו.</div></div>';wireCard(dr);return}
  const cov=COV[cid]||{},shared=cov.shared_with&&cov.shared_with.length,miss=(cov.missing||[]).filter(x=>x!=='problems').map(x=>CLAB[x]);
  let h=top+'<div class="cb2"><div class="ctitle">'+(k?thumb(k,76):'')+'<div><h3>'+esc(k?k.name:cd.title)+'</h3>'+(k?'<div class="m">'+esc(k.model)+'</div>':'<div class="m">'+esc(cd.tab)+'</div>')+'<div class="m">כרטיס '+esc(cardId)+': '+esc(cd.title)+(shared&&k?' (משותף עם '+cov.shared_with.map(i=>esc(cat[i]?cat[i].name:i)).join(', ')+')':'')+'</div></div></div>';
  h+='<div class="cshort">'+gl(cd.short)+'</div>';
  const bt=[];if(k)bt.push('<button class="pill on" id="cdshow">הראי במודל</button><button class="pill" id="cd11">בגודל 1:1</button>');if(cardId==='10')bt.push('<button class="pill on" id="cdlegs">פתחי את חלון הרגליים</button>');
  if(bt.length)h+='<div class="btns" style="margin:8px 0">'+bt.join('')+'</div>';
  h+=csec('מה הוא עושה',cd.explainer?'<p>'+gl(cd.explainer)+'</p>':'<p class="cmeta">חסר בכרטיס.</p>',true);
  h+=csec('מה הוא צריך לעשות בכלי',ulc(cd.needs),true);
  if(k){const o=(k.orient&&k.orient.text?'<p>'+gl(k.orient.text)+' <span class="cmeta">('+esc(k.orient.source||'')+')</span></p>':'')+(k.fov&&k.fov.text?'<p><b>טווח ראייה:</b> '+gl(k.fov.text)+' <span class="cmeta">('+esc(k.fov.source||'')+')</span></p>':'')+(k.why?'<p><b>למה כאן:</b> '+gl(k.why)+'</p>':'');
    h+=csec('איך הוא יושב בכלי',o+ulc(cd.placement),true)}else h+=csec('איך הוא יושב בכלי',ulc(cd.placement),true);
  if(k){const row=(l,v,key)=>'<tr><td>'+l+'</td><td>'+v+'</td><td>'+(key?chip(k,key):'')+'</td></tr>';
    h+=csec('המספרים','<table class="nums">'+row('מידות','<span dir="ltr">'+esc(dimTxt(k))+'</span>','dims')+row('כמות',k.qty,null)+row('משקל ליחידה',k.weight==null?'לא ידוע':k.weight+' גרם','weight')+row('הספק ליחידה',k.power==null?'לא ידוע':k.power+' W','power')+'</table>'
      +(k.note?'<p class="cmeta">'+gl(k.note)+'</p>':'')+(k.source?'<p class="cmeta">מקור: '+esc(k.source)+'</p>':'')+'<p class="cmeta">הערכה: מספר שלנו ולא של היצרן. יש מקור: מופיע בכרטיס או במקור שמצוין, ולא נבדק שוב בשלב הזה.</p>',true)}
  if(k){const dep=(DEF.dependencies||[]).filter(x=>x.child===cid||x.parent===cid),op=(DEF.openings||[]).filter(x=>(x['for']||[]).includes(cid));
    let l='';dep.forEach(x=>{const other=x.child===cid?x.parent:x.child;l+='<li>'+gl(x.text)+(cat[other]?' <button class="pill sm" data-o="'+other+'">הראי: '+esc(cat[other].name)+'</button>':'')+'</li>'});
    op.forEach(x=>{l+='<li><b>'+esc(x.kind)+':</b> '+gl(x.rule)+'</li>'});
    h+=csec('מה הוא מגביל בעיצוב',l?'<ul>'+l+'</ul>':'',true)}
  h+=csec('מה עדיין פתוח',ulc(cd.open),true);
  h+=csec('החלטות',ulc(cd.decided),false);h+=csec('למה (עם מקורות)',ulc(cd.why),false);h+=csec('חלופות שנבדקו',ulc(cd.alternatives),false);h+=csec('בעיות לפתור',ulc(cd.problems),false);h+=csec('הערות',ulc(cd.notes),false);
  h+=csec('מקורות',cd.sources&&cd.sources.length?'<ul>'+cd.sources.map(s=>'<li><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a></li>').join('')+'</ul>':'',false);
  if(miss.length)h+='<p class="cmeta">חסר בכרטיס: '+miss.join(', ')+'.</p>';
  dr.innerHTML=h+'</div>';wireCard(dr);
}
function wireCard(dr){
  const g=(s,f)=>{const e=dr.querySelector(s);if(e)e.onclick=f};g('#cdx',closeCard);g('#cdgl',openGloss);g('#cdshow',showInModel);g('#cd11',()=>openTrue(CD.cid));g('#cdlegs',()=>{$('#legsbtn').click()});
  dr.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const it=cfg().items.find(i=>i.cid===b.dataset.o);if(it){sel=it.id;V.rng='sel';V.arr=true;renderVopts();renderLight()}});
  dr.querySelectorAll('.term').forEach(t=>t.onclick=()=>openGloss(+t.dataset.g))}
/* "show in model": select it, show its view range and facing arrow, and make sure a 3D view is on screen */
function showInModel(){const c=cfg(),it=c.items.find(i=>i.cid===CD.cid);if(!it)return;sel=it.id;V.rng='sel';V.arr=true;if(V.mode!=='3d'&&V.mode!=='win')setMode('win');saveUI();renderVopts();renderLight();render2D(true);build3D()}
function openGloss(i){const cur=(typeof i==='number')?i:-1;$('#mcard').innerHTML='<h2>מונחון</h2><div class="m" style="margin-bottom:8px">'+esc((DEF.glossary||{})._note||'')+'</div><dl class="gl">'+GL.map((g,j)=>'<dt'+(j===cur?' class="hit"':'')+'>'+esc(g.term)+'</dt><dd>'+esc(g.text)+'</dd>').join('')+'</dl><div class="btns" style="margin-top:12px"><button class="pill" id="mc">סגירה</button></div>';
  $('#modal').classList.add('on');$('#mc').onclick=()=>$('#modal').classList.remove('on');const h=$('#mcard .hit');if(h)h.scrollIntoView({block:'center'})}
/* 1:1: flat views at true size. Screens differ, so the scale is set once against a bank card (85.6 x 54 mm) and remembered */
function pxmm(){try{const v=parseFloat(localStorage.getItem('dash-pxmm'));if(v>1&&v<20)return v}catch(e){}return 96/25.4}
function openTrue(cid){const k=cat[cid];if(!k)return;const s0=pxmm();
  const draw=s=>{const d=k.dims,r=(w,h,l)=>'<div class="tv"><div class="tr" style="width:'+w*s+'px;height:'+h*s+'px"></div><div class="tl">'+l+'</div></div>',ci=(dd,l)=>'<div class="tv"><div class="tr" style="width:'+dd*s+'px;height:'+dd*s+'px;border-radius:50%"></div><div class="tl">'+l+'</div></div>',f=v=>Math.round(v*10)/10;
    return(k.shape==='cyl'?ci(d[0],'מלמעלה: קוטר '+f(d[0])+' מ"מ')+r(d[0],d[1],'מהצד: '+f(d[0])+' × '+f(d[1])+' מ"מ'):r(d[0],d[2],'מלמעלה: '+f(d[0])+' × '+f(d[2])+' מ"מ')+r(d[0],d[1],'מהצד: '+f(d[0])+' × '+f(d[1])+' מ"מ')+r(d[2],d[1],'מלפנים: '+f(d[2])+' × '+f(d[1])+' מ"מ'))+'<div class="tv"><div class="tr ref" style="width:'+85.6*s+'px;height:'+54*s+'px"></div><div class="tl">כרטיס אשראי, להשוואה: 85.6 × 54 מ"מ</div></div>'};
  $('#mcard').innerHTML='<h2>'+esc(k.name)+': בגודל 1:1</h2><div class="m" style="margin-bottom:8px">צורה פשוטה לפי המידות בנתונים'+((k.estimate||[]).includes('dims')?' (המידות הן הערכה)':'')+'. כיול: הצמידי כרטיס אשראי למסך וכווני עד שהמלבן האפור באותו גודל. הכיול נשמר. שינוי זום בדפדפן משנה את הגודל.</div><div class="ctl" style="margin-bottom:10px"><input type="range" id="pxs" min="2.5" max="7" step="0.01" value="'+s0+'" style="flex:1" aria-label="כיול גודל"></div><div class="trow" id="trow">'+draw(s0)+'</div><div class="btns" style="margin-top:12px"><button class="pill" id="mc">סגירה</button></div>';
  $('#modal').classList.add('on');$('#mc').onclick=()=>$('#modal').classList.remove('on');
  $('#pxs').oninput=e=>{const s=parseFloat(e.target.value);try{localStorage.setItem('dash-pxmm',s)}catch(x){}$('#trow').innerHTML=draw(s)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CD.open&&!$('#modal').classList.contains('on')&&!(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))){closeCard()}});
resize3();refresh(true);
})();
</script>
